services:
  - type: web
    name: arxiv-agent-api
    runtime: python
    # Starter, not free: an upload's embed is pure CPU, and free's
    # fractional CPU made an 89-chunk paper take 311s to embed. Starter
    # also doesn't spin down, so there's no cold start in front of it.
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: NVIDIA_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      # Qdrant Cloud replaced the local FAISS index in Checkpoint 6. The URL
      # and API key are secrets (sync: false, set in the Render dashboard),
      # matching NVIDIA_API_KEY/REDIS_URL. The collection name is not a
      # secret, so it ships with its default value here.
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: arxiv_agent
      - key: CORS_ALLOWED_ORIGIN
        sync: false
      # Not a secret, so it ships with its default - the point of it
      # being here is that it shows up in the dashboard as an editable
      # value. Lower it there if an upload OOMs the instance; it takes
      # effect on restart, with no redeploy and no code change.
      - key: EMBED_BATCH_SIZE
        value: 8
      # Seconds one /upload may occupy a worker before returning 504.
      # Same rationale as EMBED_BATCH_SIZE: not a secret, ships with its
      # default, editable in the dashboard so a slow-PDF timeout can be
      # raised (or lowered) on a running instance without a redeploy.
      # Must stay below ui/app.py's own client timeout (180s).
      - key: UPLOAD_TIMEOUT_SECONDS
        value: 120
      # ONNX Runtime threads for the embedder. Leave at 1 on any plan with
      # one CPU or less - ORT's default of one thread per *host* core
      # oversubscribes a cgroup-limited slice (see rag/embedder.py).
      - key: ORT_INTRA_OP_THREADS
        value: 1
