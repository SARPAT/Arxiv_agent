services:
  - type: web
    name: arxiv-agent-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: NVIDIA_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CORS_ALLOWED_ORIGIN
        sync: false
